# Phase 1 的本機依賴。Hub 本身先用 uvicorn --reload 跑在 host 上，方便開發。
name: claude-boba-hub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boba
      POSTGRES_PASSWORD: boba
      POSTGRES_DB: boba
    # 5432 在開發機上常被既有服務佔用，對外改用 55432
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boba"]
      interval: 5s
      retries: 10

  minio:
    # 從 quay 拉，不是 Docker Hub —— minio/minio 在 Docker Hub 上已不存在
    # （API 回 "object not found"，2026-09-21 實測）。
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: boba
      MINIO_ROOT_PASSWORD: boba-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
