<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="珍珠奶茶">
  <!-- 分頁 favicon 只有 16px，所以刻意用粗輪廓與高對比：
       杯身一個梯形、蓋子一條橫槓、三顆珍珠。細節在那個尺寸下看不見，
       只會糊成一團。 -->
  <title>claude-boba</title>

  <!-- 吸管 -->
  <path d="M19.5 3.5 L23 3.5 L18.5 12 L15.5 12 Z" fill="#c85a54"/>

  <!-- 杯身（上寬下窄） -->
  <path d="M6.5 9 H25.5 L22.5 29 A1.5 1.5 0 0 1 21 30 H11 A1.5 1.5 0 0 1 9.5 29 Z"
        fill="#e3b787" stroke="#5b3a22" stroke-width="2" stroke-linejoin="round"/>

  <!-- 珍珠 -->
  <circle cx="13" cy="25" r="2.1" fill="#3a2317"/>
  <circle cx="18.5" cy="25.5" r="2.1" fill="#3a2317"/>
  <circle cx="16" cy="21.5" r="2.1" fill="#3a2317"/>

  <!-- 杯蓋 -->
  <rect x="4.5" y="6" width="23" height="4.6" rx="2.3" fill="#5b3a22"/>
</svg>
