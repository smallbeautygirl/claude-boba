# 同源部署：靜態檔自己服務，/api/ 轉給 hub 容器。

# job 詳情頁的即時串流是 SSE（api.ts streamUrl / JobDetail.tsx EventSource）。
# nginx 預設會把上游回應先緩衝再整批送，SSE 會變成「跑完才一次出現」——
# 而 web-spec §4 的「可以離開」心智模型靠的就是它即時。所以 /api/ 關掉緩衝、
# 把讀取逾時拉到比 job 上限（10 分鐘）長。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 不用 upstream 區塊、改用變數 + Docker 的內建 DNS：
  # upstream 只在 nginx 啟動時解析一次，hub 容器重啟換了 IP 之後 nginx 會抱著
  # 舊 IP 一路回 502，直到有人重啟 nginx。變數形式的 proxy_pass 每次都重新解析
  # （valid=10s 是快取上限）。這也是 `nginx -t` 能在 compose 外通過的原因。
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $hub http://hub:8787;

  # 上傳走的是瀏覽器直接 PUT 到 MinIO 的預簽 URL，不經過這裡，
  # 所以 body 上限只要裝得下 prompt（MAX_PROMPT_CHARS 2M）就夠。
  client_max_body_size 8m;

  location /api/ {
    proxy_pass $hub;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location /healthz {
    proxy_pass $hub/healthz;
  }

  # SPA：路由都在前端（react-router），任何路徑都回 index.html。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
