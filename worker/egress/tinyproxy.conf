User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info

# 只有 job 網段連得到這個 proxy
Allow 0.0.0.0/0

# CONNECT 只開 443：job 不能用 proxy 打其他 port
ConnectPort 443

# 白名單。FilterDefaultDeny 是這整個設計的重點——
# 沒列在 allowlist 裡的一律拒絕，而不是「黑名單以外都放行」。
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
